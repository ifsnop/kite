<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24" viewBox="0 0 24 24"
     fill="none"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     role="img" aria-labelledby="kite-icon-title">
  <title id="kite-icon-title">KITE Local</title>

  <!-- compartir. The upper branch is the SHORT one: both strokes still
       start at the pin (x = 8, inside its outline, so they read as joined)
       and keep slope ±0.5, but the upper one is trimmed at its far end and
       its circle moved in with it — shortening the stroke alone would have
       left it floating away from a circle that never moved. -->
  <circle cx="16" cy="7" r="2" fill="#4CAF50" stroke="#4CAF50"/>
  <circle cx="18" cy="18" r="2" fill="#4CAF50" stroke="#4CAF50"/>

  <path d="M8 11l6-3"
        stroke="#4CAF50"/>

  <path d="M8 13l8 4"
        stroke="#4CAF50"/>

  <!-- pin: head r 2.5 centred on (5.5, 9.5), tip at (5.5, 16). Grown from
       r 2 by extending LEFT and DOWN, keeping its right edge on x = 8, so
       a bigger pin does not push into the two strokes. -->
  <path d="M5.5 16s-2.5-3.25-2.5-6.5a2.5 2.5 0 1 1 5 0c0 3.25-2.5 6.5-2.5 6.5z"
        stroke="#3388ff"/>

</svg>
