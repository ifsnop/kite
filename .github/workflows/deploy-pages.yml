name: Deploy KITE Local to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      # Mismo paso que tests.yml y release.yml: kitelocal.html/.min.html
      # son GENERADOS y esto es lo que se sirve tal cual desde el
      # repositorio (este workflow no reconstruye nada).
      - name: Comprobar que kitelocal.html está al día respecto de src/
        run: npm run check

      - name: Instalar el navegador de las pruebas
        run: npx playwright install --with-deps chromium

      # tests.yml se dispara con el mismo push a main pero corre en un
      # workflow aparte, sin relación `needs`: antes, este job publicaba
      # en Pages sin esperar a que esas pruebas terminaran, así que un
      # push con tests en rojo podía desplegarse igual. Igual que en
      # release.yml, la forma más simple de que el despliegue dependa de
      # verdad de los tests es correrlos aquí mismo, en el mismo job: si
      # esto falla, los pasos de despliegue de abajo ni se ejecutan.
      - name: Ejecutar tests
        run: npm test
        env:
          KITE_REQUIRE_BROWSER: "1"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # El servicio de Pages falla a veces de forma transitoria al desplegar un
      # artefacto recién subido ("Found 0 artifact(s)": ocurrió con los tests en
      # verde, run 37312559354). Un segundo intento un minuto después suele
      # bastar. `continue-on-error` en el primero evita que un fallo ya
      # recuperado deje el job en rojo (y mande un correo de fallo por algo que
      # ya está resuelto); si el SEGUNDO intento también falla, el job falla y
      # GitHub manda su correo de fallo de siempre: ese es el único aviso que se
      # quiere. No hay correo de confirmación a propósito: GitHub solo avisa de
      # los fallos, y un despliegue que se recupera solo no necesita atención.
      # El primer fallo queda a la vista como anotación del run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes de reintentar el despliegue
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=Despliegue a Pages::El primer intento falló; se reintenta en 60 s."
          sleep 60

      - name: Deploy to GitHub Pages (reintento)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
