name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      # kitelocal.html se GENERA desde src/ y se versiona porque es el
      # producto. Aquí se comprueba que el archivo del repositorio
      # corresponde a las fuentes, sin reconstruirlo: si alguien empuja un
      # cambio en src/ sin construir, lo que se publica sería la versión
      # anterior y los tests estarían probando código viejo.
      # Es un paso propio, y no solo la comprobación que ya hace
      # run-all.js, para que el fallo se lea en el nombre del paso.
      - name: Comprobar que kitelocal.html está al día respecto de src/
        run: npm run check

      # El navegador NO lo descarga `npm ci` (Playwright no lo trae en
      # node_modules a propósito): hay que pedirlo. `--with-deps` añade
      # las librerías de sistema que el runner no trae de fábrica.
      - name: Instalar el navegador de las pruebas
        run: npx playwright install --with-deps chromium

      # KITE_REQUIRE_BROWSER convierte en FALLO el salto de las pruebas
      # de navegador. En local saltárselas es legítimo —no todo el mundo
      # puede o quiere descargar 300 MB—, pero aquí esa cobertura no
      # puede perderse en silencio.
      - name: Ejecutar tests
        run: npm test
        env:
          KITE_REQUIRE_BROWSER: "1"
